import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
        // Kotlin 2.1.0 required by @capacitor/filesystem@8.1+ which pulls in
        // kotlin-stdlib 2.1.0 via @capacitor/synapse. Using 2.1.0 here ensures
        // the compiler and runtime stdlib versions are consistent.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Align Java + Kotlin JVM targets to 21 for every subproject.
// capacitor-filesystem@8.1+ requires Kotlin 2.1.0 / Java 21.
// capacitor-health-connect defaults to Java 17, which would create a mismatch
// with the Kotlin 21 target set below, so we force both to 21.
subprojects {
    afterEvaluate {
        tasks.withType(KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "21"
        }
        // Also bump the Android compileOptions target for library modules
        // that default to Java 17 (e.g. capacitor-health-connect).
        try {
            android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        } catch (ignored) { /* not an Android module */ }
    }
}
